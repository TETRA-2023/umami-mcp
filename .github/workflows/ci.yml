name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan repo (full history)
        run: gitleaks detect --no-banner --redact --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: [secrets, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    needs: [secrets, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SMOKE_NAME: smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image name
        id: repo
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-smoke:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container smoke test: start the REAL image through its entrypoint and
      # transport, then initialize + tools/list. Unit tests stayed green while
      # langfuse-mcp v1.1.6/v1.1.7 crash-looped at import in prod (2026-10-07,
      # TETRA-2023/langfuse-mcp#81); this step is what catches that. Dummy
      # credentials only: tools/list must not need a live Umami. No host port is published,
      # and the script is piped on stdin (no bind mount: self-hosted runners
      # drive the HOST daemon, which cannot see the runner's workspace).
      - name: Smoke test image (initialize + tools/list)
        run: |
          docker run -d --name "$SMOKE_NAME" \
            -e UMAMI_URL=http://127.0.0.1:9 \
            -e UMAMI_USERNAME=ci \
            -e UMAMI_PASSWORD=ci \
            -e UMAMI_TRANSPORT=streamable-http \
            -e MCP_HOST=0.0.0.0 \
            -e MCP_PORT=8000 \
            -e MCP_BEARER_TOKEN=ci-token \
            mcp-smoke:ci
          docker run --rm -i --network "container:$SMOKE_NAME" python:3.12-alpine \
            python - http http://127.0.0.1:8000/mcp --bearer ci-token --wait 60 \
            < scripts/ci/mcp-smoke.py
        timeout-minutes: 3

      - name: Smoke test logs and cleanup
        if: always()
        run: |
          docker logs --tail 50 "$SMOKE_NAME" 2>&1 || true
          docker rm -f "$SMOKE_NAME" >/dev/null 2>&1 || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (:latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.repo.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [secrets, lint, test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22" # semantic-release 25 needs ^22.14 || >=24.10
          cache: npm

      - run: npm ci

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release
