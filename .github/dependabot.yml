# Dependabot configuration.
#
# - uv: security + version-update PRs for npm deps in package-lock.json.
# - github-actions: keeps the action pins in .github/workflows current.
#
# These are first-party TETRA repos, so PRs are mergeable as-is after CI.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # Runtime deps -> fix(deps) so a security/runtime bump cuts a patch release
      # (-> release-image.yml builds a fresh :stable + :X.Y.Z with the fix).
      # Dev/tooling deps -> chore(deps-dev): no release.
      prefix: "fix"
      prefix-development: "chore"
      # include: scope -> "fix(deps): ..." / "chore(deps-dev): ..." (US-7 #2938).
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      # Action pins are CI-only: "ci(deps): ..." never cuts a release (US-7 #2938).
      prefix: "ci"
      include: "scope"
